name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的版本（tag、commit 或分支）。留空＝目前分支最新版；填舊的 tag 即可回復到那個版本'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 正式版的 LIFF ID（Published）放在 repo 的 Actions Variables：LIFF_ID。沒設定就停止部署，避免上線後 LINE 功能失效。
      - name: Check LIFF_ID variable
        env:
          LIFF_ID: ${{ vars.LIFF_ID }}
        run: |
          if [ -z "$LIFF_ID" ]; then
            echo "::error::請到 repo 的 Settings → Secrets and variables → Actions → Variables 新增 LIFF_ID"
            exit 1
          fi
      - run: npm run build
        env:
          VITE_LIFF_ID: ${{ vars.LIFF_ID }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
